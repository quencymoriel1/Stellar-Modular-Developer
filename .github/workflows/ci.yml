name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/modular_developer -> target

      - name: Run contract unit & integration tests
        run: cargo test --manifest-path contracts/modular_developer/Cargo.toml

  packages:
    name: Build Packages & Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Build Proxy Package
        run: npm run build:proxy

      - name: Build CLI & MCP
        run: |
          npm run build:cli
          npm run build:mcp

      - name: Build Frontend Dashboard
        run: npm run build:frontend

      - name: Lint Workspace
        run: npm run lint
